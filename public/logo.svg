<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>Finance Control</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      path { transform-box: fill-box; transform-origin: center bottom; animation: grow .55s cubic-bezier(.2,.75,.25,1) backwards; }
      path:nth-of-type(2) { animation-delay: .1s; }
      path:nth-of-type(3) { animation-delay: .2s; }
      @keyframes grow { from { transform: scaleY(.2); opacity: .3; } to { transform: scaleY(1); opacity: 1; } }
    }
  </style>
  <rect width="48" height="48" rx="13" fill="#173F37"/>
